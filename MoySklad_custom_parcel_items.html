<body><div class="app"><aside class="sidebar"><div class="brand">МОЙ <span>СКЛАД</span></div><nav class="nav" id="nav"></nav><div class="side-note">Личный учёт ресейл-бизнеса<br>Локальное хранение · ₽</div></aside><main class="main"><header class="top"><div><h1 id="pageTitle">Обзор</h1><div class="sub" id="pageSub">Сводка по твоему складу</div></div><div class="actions"><button class="btn" onclick="backup()">Экспорт копии</button><button class="btn primary" onclick="openProduct()">＋ Товар</button></div></header><div id="view"></div></main></div><nav class="mobile-nav" id="mobileNav"></nav>

<script>
const CATEGORIES=['Свитшот','Худи','Зипка','Куртка','Ветровка','Бомбер','Обувь','Аксессуар','Головной убор','Кроссовки','Штаны','Джинсы','Шорты','Другое'];
const STATUSES=['В наличии','Ищу покупателя','Зарезервирован','Продан'];
const navItems=[['overview','◫','Обзор'],['stock','▦','Склад'],['finance','₽','Финансы'],['analytics','▥','Аналитика'],['calculator','▣','Калькулятор'],['settings','⚙','Настройки']];
const seed=[
['Худи C.P. Company серое S с 1 линзой','Худи','S',1,4361,1379,0,7500,'Продан','2026-11-02'],
['Худи Amiri Banana Tree M','Худи','M',1,10651,2500,0,15000,'Продан','2026-11-07'],

['Свитшот C.P. Company синий с линзой 14 лет','Свитшот','14 лет',1,1652,950,0,7360,'Продан','2026-11-06'],
['Свитшот C.P. Company красный с линзой S','Свитшот','S',1,2177,1082,0,6000,'Продан','2026-11-02'],
['Шапка C.P. Company чёрная с 2 линзами','Головной убор','UN',1,1824,220,0,4800,'Продан','2026-10-28'],
['Зипка Palm Angels Zip Up','Зипка','XXS',1,1500,200,0,4500,'Продан','2026-11-07']
];
let db,products=[],expenses=[],photosPending=[],currentPhotos=[],shipmentHistory=[],page='overview';
const money=n=>(Number(n)||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';
const num=id=>Number(document.getElementById(id).value)||0;
const cost=p=>+p.buy+(+p.delivery||0)+(+p.other||0);
const profit=p=>p.status==='Продан'?(+p.sell||0)-cost(p):0;
const roi=p=>cost(p)?profit(p)/cost(p)*100:0;
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open('moySkladDB',1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('products'))d.createObjectStore('products',{keyPath:'id'});if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});if(!d.objectStoreNames.contains('expenses'))d.createObjectStore('expenses',{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function all(store){return new Promise((res,rej)=>{let r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(store,v){return new Promise((res,rej)=>{let r=tx(store,'readwrite').put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function del(store,id){return new Promise((res,rej)=>{let r=tx(store,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}

let calcProfiles=[],calcProfileId='vinted';
const DEFAULT_PROFILES=[{id:'vinted',name:'Vinted',feePercent:5,feeFixed:0.70,receive:2.5,deliveryToWarehouse:3,processing:0,photoFee:1.95,paymentPercent:0,paymentFixed:0,packaging:6.75,shippingRate:63.54/6.5,shippingMode:'actual',volumetricDivisor:5000,roundStep:0.5}];
const DEFAULT_PARCEL_ITEMS=[
 {id:'thin',name:'Футболка / тонкая вещь',weight:.25,volume:2.2},
 {id:'shirt',name:'Рубашка',weight:.3,volume:2.5},
 {id:'sweat',name:'Свитшот / худи',weight:.65,volume:4.5},
 {id:'jacket',name:'Куртка / верхняя одежда',weight:1.0,volume:8},
 {id:'trousers',name:'Штаны / джинсы',weight:.5,volume:3.2},
 {id:'shorts',name:'Шорты',weight:.25,volume:2},
 {id:'dress',name:'Платье',weight:.35,volume:3.5},
 {id:'shoes',name:'Обувь в коробке',weight:1.1,volume:12},
 {id:'hat',name:'Шапка',weight:.15,volume:1.5},
 {id:'cap',name:'Кепка',weight:.12,volume:1.2},
 {id:'scarf',name:'Шарф',weight:.2,volume:2},
 {id:'gloves',name:'Перчатки',weight:.12,volume:.8},
 {id:'bag',name:'Сумка / рюкзак',weight:.45,volume:4},
 {id:'accessory',name:'Аксессуар',weight:.2,volume:1.5},
 {id:'other',name:'Другое',weight:.3,volume:2.5}
];
let PARCEL_ITEMS=DEFAULT_PARCEL_ITEMS.map(x=>({...x}));
async function loadParcelItems(){
 let rec=await new Promise(r=>{let q=tx('meta').get('parcelItemTypes');q.onsuccess=()=>r(q.result)});
 let saved=Array.isArray(rec?.value)?rec.value:[];
 let byId=new Map(saved.map(x=>[x.id,x]));
 // Add any new built-in types without removing the user's own types.
 for(let item of DEFAULT_PARCEL_ITEMS) if(!byId.has(item.id)) byId.set(item.id,{...item});
 PARCEL_ITEMS=[...byId.values()];
 await saveParcelItems();
}
async function saveParcelItems(){
 await put('meta',{key:'parcelItemTypes',value:PARCEL_ITEMS});
}
const gbp=n=>(Number(n)||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' £';
function getCalcProfile(){return calcProfiles.find(x=>x.id===calcProfileId)||calcProfiles[0]}
async function loadCalcProfiles(){let rec=await new Promise(r=>{let q=tx('meta').get('calcProfiles');q.onsuccess=()=>r(q.result)});calcProfiles=rec?.value||DEFAULT_PROFILES.map(x=>({...x}));}
async function saveCalcProfiles(){await put('meta',{key:'calcProfiles',value:calcProfiles})}
async function loadShipmentHistory(){
 let rec=await new Promise(r=>{let q=tx('meta').get('shipmentHistory');q.onsuccess=()=>r(q.result)});
 if(Array.isArray(rec?.value)){shipmentHistory=rec.value;return}
 shipmentHistory=[{
  id:'shopogolic-first-invoice',date:'',label:'Первая посылка — данные из счёта',
  isActual:true,itemCount:10,actualWeight:6.4,goodsWeight:null,
  length:37,width:37,height:37,volumeWeight:37*37*37/5000,

function getParcelEstimate(){
 let count=0,goodsWeight=0,volumeLitres=0;
 for(let x of PARCEL_ITEMS){
  let qty=Math.max(0,calcVal('eq_'+x.id));
  count+=qty;goodsWeight+=qty*calcVal('ew_'+x.id);volumeLitres+=qty*calcVal('ev_'+x.id);
 }
 let compact=document.getElementById('cPackingMode')?.value==='compact';
 let packFactor=compact?.82:1.12;
 let length=calcVal('cLength')||37,width=calcVal('cWidth')||37;
 let packedLitres=volumeLitres*packFactor;
 let height=(length>0&&width>0&&packedLitres>0)?Math.ceil(packedLitres*1000/(length*width)):0;
 let boxWeight=calcVal('cBoxWeight');
 return {count,goodsWeight,volumeLitres,packedLitres,length,width,height,boxWeight,packedWeight:goodsWeight+boxWeight};
}

function updatePurchaseCalc(){
 let p=getCalcProfile();if(!p||!document.getElementById('cPrice'))return;
 let price=calcVal('cPrice'),count=Math.max(1,calcVal('cCount')),photos=calcVal('cPhotos'),weight=calcVal('cWeight'),L=calcVal('cLength'),W=calcVal('cWidth'),H=calcVal('cHeight'),divisor=Math.max(1,p.volumetricDivisor||5000),volume=L*W*H/divisor,step=Math.max(.01,p.roundStep||.5);
 let mode=document.getElementById('cShippingMode')?.value||p.shippingMode;
 let charge=weight;if(mode==='volumetric')charge=volume;else if(mode==='max')charge=Math.max(weight,volume);
 charge=Math.ceil(charge/step)*step;
 let ship=charge*(+p.shippingRate||0),shipShare=ship/count,goodsWeight=calcVal('cGoodsWeight'),itemWeight=calcVal('cItemWeight'),distribution=document.getElementById('cDistribution')?.value||'equal';
 if(distribution==='weight'&&goodsWeight>0&&itemWeight>0)shipShare=ship*Math.min(1,itemWeight/goodsWeight);
 let pack=(+p.packaging||0)/count,receive=+p.receive||0,localDelivery=+p.deliveryToWarehouse||0,processing=+p.processing||0,photoCost=photos*(+p.photoFee||0),fee=price*(+p.feePercent||0)/100+(+p.feeFixed||0),pay=price*(+p.paymentPercent||0)/100+(+p.paymentFixed||0);
 let total=price+fee+pay+receive+localDelivery+processing+photoCost+shipShare+pack;
 let distributionText=distribution==='weight'&&goodsWeight>0?'по весу':'поровну';
 let lines=[['Цена товара',gbp(price)],['Комиссия площадки',gbp(fee)],['Комиссия оплаты',gbp(pay)],['Приёмка на склад карго',gbp(receive)],['Доставка до склада карго',gbp(localDelivery)],['Дополнительная обработка',gbp(processing)],['Фотографии',gbp(photoCost)],['Международная доставка ('+distributionText+')',gbp(shipShare)],['Упаковка (доля посылки)',gbp(pack)]];
 document.getElementById('calcBreakdown').innerHTML=lines.map(x=>`<div class="calc-line"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
 document.getElementById('calcGrand').textContent=gbp(total);
 let rate=calcVal('cRate');document.getElementById('calcRub').textContent=rate>0?'Примерно '+money(total*rate):'Укажи курс, чтобы увидеть сумму в рублях';
 document.getElementById('shippingHint').textContent=`Объёмный вес по делителю ${divisor}: ${volume.toFixed(2)} кг · Тарифицируемый вес (${mode==='actual'?'фактический':mode==='volumetric'?'объёмный':'больший'} с округлением ${step} кг): ${charge.toFixed(2)} кг · Доставка посылки: ${gbp(ship)} · На товар: ${gbp(shipShare)}`;
 window.lastPurchaseCalc={total,lines,rate,ship,charge,volume,mode,shipShare,itemCount:count,weight,length:L,width:W,height:H,goodsWeight,distribution};
}

  note:document.getElementById('histNote').value.trim()
 };
 if(record.actualShippingCost!=null&&(!Number.isFinite(record.actualShippingCost)||record.actualShippingCost<0)){alert('Проверь фактическую стоимость доставки.');return}
 if(record.actualTotal!=null&&(!Number.isFinite(record.actualTotal)||record.actualTotal<0)){alert('Проверь итоговую сумму счёта.');return}
 if(record.otherServices!=null&&(!Number.isFinite(record.otherServices)||record.otherServices<0)){alert('Проверь дополнительные расходы.');return}
 shipmentHistory.push(record);await saveShipmentHistory();
 document.getElementById('shipmentHistoryList').innerHTML=renderShipmentHistory();
 document.getElementById('histLabel').value='';document.getElementById('histShipActual').value='';document.getElementById('histTotalActual').value='';document.getElementById('histOtherActual').value='';document.getElementById('histNote').value='';
 alert('Посылка сохранена в истории.');
}
async function deleteShipmentRecord(id){
 if(!confirm('Удалить эту запись из истории отправок?'))return;
 shipmentHistory=shipmentHistory.filter(x=>x.id!==id);await saveShipmentHistory();

function loadShipmentRecord(id){
 let x=shipmentHistory.find(z=>z.id===id);if(!x)return;
 for(let [id2,value] of [['cCount',x.itemCount],['cWeight',x.actualWeight],['cLength',x.length],['cWidth',x.width],['cHeight',x.height],['cGoodsWeight',x.goodsWeight||'']]){
  let el=document.getElementById(id2);if(el&&value!=null)el.value=value;
 }

 updatePurchaseCalc();window.scrollTo({top:0,behavior:'smooth'});
}


async function init(){db=await openDB();await loadCalcProfiles();await loadParcelItems();await loadShipmentHistory();products=await all('products');let meta=await new Promise(r=>{let q=tx('meta').get('seeded');q.onsuccess=()=>r(q.result)});if(!meta){for(let i=0;i<seed.length;i++){let x=seed[i];await put('products',{id:'legacy-'+(i+1),name:x[0],category:x[1],size:x[2],batch:String(x[3]),buy:x[4],delivery:x[5],other:x[6],sell:x[7],status:x[8],saleDate:x[9],link:'',source:'Бюджет бизнеса',photoIds:[],createdAt:new Date().toISOString()})}await put('meta',{key:'seeded',value:true});}products=await all('products');expenses=await all('expenses');buildNav();render();}
function buildNav(){for(let id of ['nav','mobileNav'])document.getElementById(id).innerHTML=navItems.map(([k,ic,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${ic} ${t}</button>`).join('')}
function go(p){page=p;buildNav();render();window.scrollTo(0,0)}
function metrics(){let sold=products.filter(p=>p.status==='Продан'),revenue=sold.reduce((a,p)=>a+(+p.sell||0),0),soldCost=sold.reduce((a,p)=>a+cost(p),0),totalCost=products.reduce((a,p)=>a+cost(p),0),stock=products.filter(p=>p.status!=='Продан').reduce((a,p)=>a+cost(p),0),exp=expenses.reduce((a,e)=>a+(+e.amount||0),0);return{sold,revenue,soldCost,totalCost,stock,profit:revenue-soldCost,exp,count:products.length}}
function metric(label,value,cls=''){return `<div class="card"><div class="metric-label">${label}</div><div class="metric ${cls}">${value}</div></div>`}
function render(){let m=metrics(),v=document.getElementById('view');document.getElementById('pageTitle').textContent=navItems.find(x=>x[0]===page)[2];document.getElementById('pageSub').textContent=({overview:'Сводка по твоему складу',stock:'Товары, партии и остатки',finance:'Движение денег и расходы',analytics:'Результаты на основе сохранённых данных',settings:'Хранение и резервное копирование',calculator:'Расчёт полной стоимости закупки'})[page];
if(page==='overview'){v.innerHTML=`<div class="grid">${metric('Выручка',money(m.revenue))}${metric('Прибыль по продажам',money(m.profit),'positive')}${metric('Себестоимость склада',money(m.totalCost))}${metric('Товаров на складе',products.filter(p=>p.status!=='Продан').length)}</div><div class="section grid">${metric('Продано',m.sold.length)}${metric('Не продано',products.length-m.sold.length)}${metric('Заморожено в остатках',money(m.stock))}${metric('Средняя прибыль / продажа',money(m.sold.length?m.profit/m.sold.length:0))}</div><div class="section panel"><div class="section-head"><h2>Последние товары</h2><button class="btn" onclick="go('stock')">Весь склад →</button></div>${tableRows(products.slice().reverse().slice(0,6))}</div><div class="notice">Данные сохранены локально в этом браузере. Для переноса на другое устройство используй резервную копию в разделе «Настройки».</div>`}
if(page==='stock'){v.innerHTML=`<div class="toolbar"><input class="field" id="search" placeholder="Поиск по названию…" oninput="filterStock()"><select class="field" id="catFilter" onchange="filterStock()"><option value="">Все категории</option>${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select><select class="field" id="statusFilter" onchange="filterStock()"><option value="">Все статусы</option>${STATUSES.map(s=>`<option>${s}</option>`).join('')}</select><select class="field" id="batchFilter" onchange="filterStock()"><option value="">Все партии</option>${[...new Set(products.map(p=>p.batch))].sort().map(b=>`<option>${esc(b)}</option>`).join('')}</select><button class="btn primary" onclick="openProduct()">＋ Добавить</button></div><div class="productgrid" id="productGrid"></div><div class="section panel"><div class="section-head"><h2>Сводка по партиям</h2></div>${batchTable()}</div>`;filterStock()}
if(page==='finance'){v.innerHTML=`<div class="grid">${metric('Выручка',money(m.revenue))}${metric('Закупка и логистика проданного',money(m.soldCost))}${metric('Прибыль',money(m.profit),'positive')}${metric('Дополнительные расходы',money(m.exp))}</div><div class="section panel"><div class="section-head"><h2>Добавить расход</h2></div><div class="toolbar"><input class="field" id="expName" placeholder="Например: упаковка, комиссия"><input class="field" id="expAmount" type="number" min="0" placeholder="Сумма, ₽"><select class="field" id="expSource"><option>Бюджет бизнеса</option><option>Личные средства</option></select><input class="field" id="expDate" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="btn primary" onclick="addExpense()">Добавить</button></div><div class="table-wrap"><table><thead><tr><th>Расход</th><th>Источник</th><th>Дата</th><th>Сумма</th><th></th></tr></thead><tbody>${expenses.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.source)}</td><td>${e.date||'—'}</td><td>${money(e.amount)}</td><td><button class="btn danger" onclick="removeExpense('${e.id}')">Удалить</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Дополнительных операций пока нет</td></tr>'}</tbody></table></div></div><div class="notice">Покупки товаров отражаются в их карточках. Источник денег указывается в карточке товара. Не смешивай личные средства и бюджет бизнеса при анализе движения денег.</div>`}
if(page==='analytics'){let cats={};products.filter(p=>p.status==='Продан').forEach(p=>{let c=cats[p.category]||(cats[p.category]={count:0,profit:0,revenue:0});c.count++;c.profit+=profit(p);c.revenue+=+p.sell||0});let months={};m.sold.forEach(p=>{let k=(p.saleDate||'Без даты').slice(0,7);months[k]=(months[k]||0)+profit(p)});let years=[...new Set(m.sold.map(p=>(p.saleDate||'').slice(0,4)).filter(Boolean))];v.innerHTML=`<div class="toolbar"><select class="field" id="yearFilter" onchange="renderAnalytics()"><option value="">Весь год</option>${years.map(y=>`<option>${y}</option>`).join('')}</select></div><div class="grid" id="analyticsMetrics"></div><div class="section panel"><div class="section-head"><h2>Прибыль по месяцам</h2></div><div id="monthBars" class="bars"></div></div><div class="section panel"><div class="section-head"><h2>Продажи и прибыль по категориям</h2></div><div class="table-wrap"><table><thead><tr><th>Категория</th><th>Продажи</th><th>Выручка</th><th>Прибыль</th></tr></thead><tbody>${Object.entries(cats).map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.count}</td><td>${money(x.revenue)}</td><td class="positive">${money(x.profit)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Нет продаж</td></tr>'}</tbody></table></div></div>`;renderAnalytics()}
if(page==='settings'){v.innerHTML=`<div class="panel"><div class="section-head"><h2>Резервное копирование</h2></div><p class="muted">Копия включает товары, финансовые операции и фотографии. Храни файл отдельно от устройства.</p><div class="actions"><button class="btn primary" onclick="backup()">Скачать резервную копию</button><button class="btn" onclick="document.getElementById('importFile').click()">Восстановить из копии</button></div><div class="notice">При импорте данные из файла добавляются или обновляются по ID; существующие записи не удаляются. Перед восстановлением рекомендуется скачать текущую копию.</div></div><div class="section panel"><h2>Хранилище</h2><p class="muted">База IndexedDB в текущем браузере. Фотографии хранятся отдельно от карточек товаров.</p><p>Товаров: <b>${products.length}</b> · Дополнительных расходов: <b>${expenses.length}</b></p><button class="btn" onclick="backup()">Экспортировать данные</button></div><div class="section panel"><h2>Категории и статусы</h2><p class="muted">Категории: ${CATEGORIES.join(' · ')}</p><p class="muted">Статусы: ${STATUSES.join(' · ')}</p></div>`}

if(page==='calculator'){renderCalculator(v)}
}
function tableRows(list){return `<div class="table-wrap"><table><thead><tr><th>Товар</th><th>Партия</th><th>Себестоимость</th><th>Продажа</th><th>Прибыль</th><th>Статус</th></tr></thead><tbody>${list.map(p=>`<tr><td class="item-title">${esc(p.name)}</td><td>${esc(p.batch||'—')}</td><td>${money(cost(p))}</td><td>${p.status==='Продан'?money(p.sell):'—'}</td><td class="${profit(p)>=0?'positive':''}">${p.status==='Продан'?money(profit(p)):'—'}</td><td><span class="status ${p.status==='Продан'?'sold':p.status==='Зарезервирован'?'reserved':''}">${esc(p.status)}</span></td></tr>`).join('')}</tbody></table></div>`}
function filterStock(){let q=(document.getElementById('search')?.value||'').toLowerCase(),c=document.getElementById('catFilter')?.value||'',s=document.getElementById('statusFilter')?.value||'',b=document.getElementById('batchFilter')?.value||'';let list=products.filter(p=>(p.name||'').toLowerCase().includes(q)&&(!c||p.category===c)&&(!s||p.status===s)&&(!b||String(p.batch)===b));document.getElementById('productGrid').innerHTML=list.map(p=>`<article class="product"><div class="product-img" id="cover-${p.id}">Без фото</div><div class="product-body"><h3>${esc(p.name)}</h3><div class="product-meta"><span>${esc(p.category)} · ${esc(p.size||'—')}</span><span>Партия ${esc(p.batch||'—')}</span></div><p class="small">Себестоимость: <b>${money(cost(p))}</b></p><p class="small">${p.status==='Продан'?'Прибыль: <b class="positive">'+money(profit(p))+'</b>':'Статус: '+esc(p.status)}</p><div class="product-actions"><button class="btn" onclick="editProduct('${p.id}')">Изменить</button><button class="btn danger" onclick="deleteProduct('${p.id}')">Удалить</button></div></div></article>`).join('')||'<div class="empty">Ничего не найдено</div>';list.forEach(loadCover)}
async function loadCover(p){if(!p.photoIds?.length)return;let rec=await new Promise(r=>{let q=tx('photos').get(p.photoIds[0]);q.onsuccess=()=>r(q.result)});if(rec){let el=document.getElementById('cover-'+p.id);if(el){let im=document.createElement('img');im.src=URL.createObjectURL(rec.blob);el.replaceChildren(im)}}}
function batchTable(){let bs={};products.forEach(p=>{let b=p.batch||'Без партии',x=bs[b]||(bs[b]={n:0,buy:0,delivery:0,other:0,cost:0,revenue:0,profit:0,sold:0,stock:0});x.n++;x.buy+=+p.buy||0;x.delivery+=+p.delivery||0;x.other+=+p.other||0;x.cost+=cost(p);if(p.status==='Продан'){x.sold++;x.revenue+=+p.sell||0;x.profit+=profit(p)}else x.stock+=cost(p)});return `<div class="table-wrap"><table><thead><tr><th>Партия</th><th>Товаров</th><th>Закупка</th><th>Доставка</th><th>Прочее</th><th>Полная стоимость</th><th>Выручка</th><th>Прибыль</th><th>Продано / остаток</th><th>Заморожено</th></tr></thead><tbody>${Object.entries(bs).map(([b,x])=>`<tr><td>${esc(b)}</td><td>${x.n}</td><td>${money(x.buy)}</td><td>${money(x.delivery)}</td><td>${money(x.other)}</td><td>${money(x.cost)}</td><td>${money(x.revenue)}</td><td class="positive">${money(x.profit)}</td><td>${x.sold} / ${x.n-x.sold}</td><td>${money(x.stock)}</td></tr>`).join('')}</tbody></table></div>`}
function renderAnalytics(){let year=document.getElementById('yearFilter')?.value||'',sold=products.filter(p=>p.status==='Продан'&&(!year||(p.saleDate||'').startsWith(year))),rev=sold.reduce((a,p)=>a+(+p.sell||0),0),cst=sold.reduce((a,p)=>a+cost(p),0),pr=rev-cst,stock=products.filter(p=>p.status!=='Продан').reduce((a,p)=>a+cost(p),0),roiVal=cst?pr/cst*100:0;document.getElementById('analyticsMetrics').innerHTML=metric('Выручка',money(rev))+metric('Прибыль',money(pr),'positive')+metric('Продаж',sold.length)+metric('Средняя прибыль',money(sold.length?pr/sold.length:0))+metric('ROI',roiVal.toFixed(2)+'%')+metric('Себестоимость склада',money(products.reduce((a,p)=>a+cost(p),0)))+metric('Непроданные товары',money(stock))+metric('Расходы отдельно',money(expenses.reduce((a,e)=>a+(+e.amount||0),0)));let months={};sold.forEach(p=>{let k=p.saleDate?.slice(0,7)||'Без даты';months[k]=(months[k]||0)+profit(p)});let vals=Object.entries(months).sort((a,b)=>a[0].localeCompare(b[0])),max=Math.max(1,...vals.map(x=>Math.abs(x[1])));document.getElementById('monthBars').innerHTML=vals.map(([k,val])=>`<div class="barrow"><span>${k}</span><div class="barbg"><div class="barfill" style="width:${Math.max(0,val)/max*100}%"></div></div><b>${money(val)}</b></div>`).join('')||'<div class="empty">Нет продаж за выбранный период</div>'}
function openProduct(p=null){photosPending=[];currentPhotos=[];document.getElementById('productForm').reset();document.getElementById('pid').value=p?.id||'';document.getElementById('modalTitle').textContent=p?'Изменить товар':'Новый товар';document.getElementById('category').innerHTML=CATEGORIES.map(c=>`<option>${c}</option>`).join('');document.getElementById('status').innerHTML=STATUSES.map(s=>`<option>${s}</option>`).join('');if(p){for(let [id,key] of [['name','name'],['category','category'],['size','size'],['batch','batch'],['status','status'],['buy','buy'],['delivery','delivery'],['other','other'],['sell','sell'],['saleDate','saleDate'],['source','source'],['link','link']])document.getElementById(id).value=p[key]??'';currentPhotos=[...(p.photoIds||[])];showExistingPhotos()}else{document.getElementById('batch').value='1';document.getElementById('status').value='В наличии';document.getElementById('photoPreview').innerHTML=''}document.getElementById('modal').classList.add('open');updateCalc()}
function editProduct(id){let p=products.find(x=>x.id===id);if(p)openProduct(p)}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function showExistingPhotos(){document.getElementById('photoPreview').innerHTML='';currentPhotos.forEach(async id=>{let rec=await new Promise(r=>{let q=tx('photos').get(id);q.onsuccess=()=>r(q.result)});if(rec){let wrap=document.createElement('div');wrap.className='photo-wrap';let im=document.createElement('img');im.className='photo';im.src=URL.createObjectURL(rec.blob);let b=document.createElement('button');b.textContent='×';b.onclick=()=>{currentPhotos=currentPhotos.filter(x=>x!==id);wrap.remove()};wrap.append(im,b);document.getElementById('photoPreview').append(wrap)}})}
document.getElementById('photos').addEventListener('change',async e=>{for(let f of e.target.files){let blob=await optimizeImage(f);photosPending.push({id:crypto.randomUUID(),blob});let wrap=document.createElement('div');wrap.className='photo-wrap';let im=document.createElement('img');im.className='photo';im.src=URL.createObjectURL(blob);let b=document.createElement('button');b.textContent='×';b.onclick=()=>{photosPending=photosPending.filter(x=>x.id!==wrap.dataset.id);wrap.remove()};wrap.dataset.id=photosPending.at(-1).id;wrap.append(im,b);document.getElementById('photoPreview').append(wrap)}});
function optimizeImage(file){return new Promise(resolve=>{if(!file.type.startsWith('image/')||!window.createImageBitmap){resolve(file);return}createImageBitmap(file).then(bitmap=>{let scale=Math.min(1,1800/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);canvas.toBlob(b=>resolve(b||file),'image/jpeg',.88)}).catch(()=>resolve(file))})}
function updateCalc(){let c=num('buy')+num('delivery')+num('other'),s=num('sell'),sold=document.getElementById('status').value==='Продан',p=sold?s-c:0;document.getElementById('calcPreview').textContent=`Себестоимость: ${money(c)} · Прибыль: ${money(p)} · ROI: ${c?(p/c*100).toFixed(2):'0.00'}%`}
['buy','delivery','other','sell','status'].forEach(id=>document.getElementById(id).addEventListener('input',updateCalc));
document.getElementById('productForm').addEventListener('submit',async e=>{e.preventDefault();let id=document.getElementById('pid').value||crypto.randomUUID(),old=products.find(p=>p.id===id),status=document.getElementById('status').value;let photoIds=[...currentPhotos];for(let ph of photosPending){await put('photos',ph);photoIds.push(ph.id)}let p={id,name:document.getElementById('name').value.trim(),category:document.getElementById('category').value,size:document.getElementById('size').value.trim(),batch:document.getElementById('batch').value.trim()||'1',buy:num('buy'),delivery:num('delivery'),other:num('other'),sell:num('sell'),status,saleDate:status==='Продан'?document.getElementById('saleDate').value:'',source:document.getElementById('source').value,link:document.getElementById('link').value.trim(),photoIds,createdAt:old?.createdAt||new Date().toISOString()};if(status==='Продан'&&!p.saleDate){alert('Укажи дату продажи.');return}await put('products',p);products=await all('products');closeModal();render()});
async function deleteProduct(id){if(!confirm('Удалить товар? Фотографии, связанные только с ним, тоже будут удалены.'))return;let p=products.find(x=>x.id===id);for(let ph of p?.photoIds||[])await del('photos',ph);await del('products',id);products=await all('products');render()}
async function addExpense(){let name=document.getElementById('expName').value.trim(),amount=Number(document.getElementById('expAmount').value);if(!name||!(amount>0)){alert('Укажи название и сумму расхода.');return}let e={id:crypto.randomUUID(),name,amount,source:document.getElementById('expSource').value,date:document.getElementById('expDate').value};await put('expenses',e);expenses=await all('expenses');render()}
async function removeExpense(id){if(confirm('Удалить этот расход?')){await del('expenses',id);expenses=await all('expenses');render()}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function backup(){let ps=await all('products'),ex=await all('expenses'),ph=await all('photos'),encoded=[];for(let p of ph)encoded.push({id:p.id,data:await blobData(p.blob)});let data={app:'Мой склад',version:1,createdAt:new Date().toISOString(),products:ps,expenses:ex,photos:encoded,calcProfiles,shipmentHistory,parcelItemTypes:PARCEL_ITEMS};let blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moy-sklad-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url)}
function blobData(blob){return new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)})}
function dataBlob(data){return fetch(data).then(r=>r.blob())}
document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.app!=='Мой склад'||!Array.isArray(d.products)||!Array.isArray(d.photos))throw Error('Неподдерживаемый файл резервной копии');if(!confirm(`Импортировать ${d.products.length} товаров и ${d.photos.length} фотографий? Существующие записи с такими ID будут обновлены.`))return;for(let x of d.products)await put('products',x);for(let x of d.expenses||[])await put('expenses',x);for(let x of d.photos)await put('photos',{id:x.id,blob:await dataBlob(x.data)});if(Array.isArray(d.calcProfiles)){calcProfiles=d.calcProfiles;await saveCalcProfiles()}if(Array.isArray(d.shipmentHistory)){shipmentHistory=d.shipmentHistory;await saveShipmentHistory()}if(Array.isArray(d.parcelItemTypes)){PARCEL_ITEMS=d.parcelItemTypes;await saveParcelItems()}products=await all('products');expenses=await all('expenses');alert('Резервная копия восстановлена.');go('overview')}catch(err){alert('Не удалось импортировать: '+err.message)}e.target.value=''});
init().catch(e=>{document.getElementById('view').innerHTML='<div class="notice">Не удалось открыть локальную базу данных. Открой приложение в современном браузере через localhost или HTTPS.</div>';console.error(e)});
</script></body></html>
